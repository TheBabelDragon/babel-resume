    docs_url: "https://github.com/TheBabelDragon/babel-interface/tree/main/contract"
    headline: "Self-describing, AI-addressable contract."
    description: >
      Metadata describes reality; it is not a second implementation.
      An agent loads .babel/ecosystem.yml and walks the capability graph.
    problem: >
      How do you make a constellation of repositories addressable to an agent
      without merging them or rewriting their internals?
    approach: |
      babel discover -> inspect graph -> find interface -> read schema -> invoke
    architecture: |
      .babel/
       +-- manifest.yml
       +-- capabilities.yml
       +-- schemas/
       +-- examples/
       +-- relations.yml
    proves: [information architecture, contract design, agent-addressable systems]
    technologies: [Python, YAML, JSON Schema]
    demonstrates: [Contract design, AI-addressable repos, Capability graphs]
    implementation: "Python / PyYAML / stdlib"
    featured: true
    status_detail: {stage: active, build: passing, tests: passing, documentation: partial, hardware: none}

