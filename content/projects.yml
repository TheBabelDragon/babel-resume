projects:
  - id: field-os
    name: "Field OS"
    status: active
    category: "systems"
    repo: "TheBabelDragon/field-os"
    headline: "A substrate-level contract for computational fields."
    description: >
      A deterministic field substrate where observation, delta admission,
      tick state and replay form an executable causal spine.
    problem: >
      How do you make a simulated physical field deterministic, observable,
      replayable and composable while mixing physical observations with
      simulated deltas without pretending they are the same?
    approach: |
      Observation -> admission -> FieldDelta -> ordering -> FieldTick -> Replay
    architecture: |
      Field
       +-- address (not a block type)
            +-- observation
            +-- FieldDelta
            +-- provenance
            +-- conservation audit
    proves:
      - deterministic state transitions
      - validated deltas
      - reproducible ticks
      - replayable state
      - synthetic != physical
    technologies: [Python, JSON Schema, deterministic simulation, replay]
    demonstrates: [Systems architecture, Deterministic state, Formal invariants]
    implementation: "Python / stdlib / locked schemas"
    featured: true
    status_detail: {stage: active, build: passing, tests: passing, documentation: partial, hardware: none}

  - id: metafield
    name: "MetaField Engine"
    status: active
    category: "simulation"
    repo: "TheBabelDragon/metafield-engine"
    headline: "Field -> World -> Tick. Cross-domain universe substrate."
    description: >
      Canonical World state, ECS, multi-physics fields, hardware abstraction
      and Aurora fabric. Optical-body, echo-grid and Aurora work become plugins.
    problem: >
      How do you keep one canonical world state when the writers are a renderer,
      an FPGA loop, an ESP32 swarm and a simulation kernel?
    approach: |
      World -> Fields -> Hardware abstraction -> FieldTick -> Viewer
    architecture: |
      MetaField Engine
       +-- World (canonical)
       +-- Fields
       +-- Aurora fabric
       +-- Plugins
    proves: [engine architecture, state transitions, plugin isolation, renderer-as-viewer]
    technologies: [C++, CMake, field simulation, ECS, deterministic ticks]
    demonstrates: [Engine architecture, State transitions, Simulation]
    implementation: "C++ / CMake"
    featured: true
    status_detail: {stage: active, build: unknown, tests: unknown, documentation: partial, hardware: none}

  - id: bylight-phy
    name: "Bylight PHY"
    status: experimental
    category: "hardware"
    repo: "TheBabelDragon/c3-field-swarm"
    headline: "Communication through light."
    description: >
      Analog optical physical layer inside the ESP32-C3 swarm substrate.
      Declared isolate. Field OS never hides it behind LINK_UP.
    problem: >
      How do distributed embedded nodes talk when RF is not the only channel,
      and the physical layer must remain honest about analog failure?
    approach: |
      pulse train -> encoding -> CRC -> receiver recovery -> FieldObservation
    architecture: |
      c3-field-swarm
       +-- FieldView / FieldDelta
       +-- swarm time
       +-- bylight_phy   (isolate)
    proves: [embedded systems, physical-layer design, protocol design]
    technologies: [ESP32-C3, C++, optical communication, FieldView, FieldDelta]
    demonstrates: [Embedded systems, Physical-layer design, Protocol design]
    implementation: "C++ / ESP32-C3"
    featured: true
    status_detail: {stage: experimental, build: unknown, tests: unknown, documentation: partial, hardware: prototype}

  - id: quack
    name: "QUACK"
    status: active
    category: "AI infrastructure"
    repo: "TheBabelDragon/throne-room"
    headline: "An AI interaction / control layer."
    description: >
      Operational Field Observer plus agent-in-a-world loop. Live CSI/Aurora
      path, FieldTick, operator ABI, and chat as actuator.
    problem: >
      How do you turn AI interaction into structured system changes without
      letting the model become the kernel?
    approach: |
      operator / chat -> Throne Room ABI -> FieldTick -> admitted delta -> world / swarm
    architecture: |
      QUACK / throne-room
       +-- operator ABI
       +-- Field Observer
       +-- CSI / Aurora path
       +-- chat as actuator
    proves: [AI systems, automation, repository orchestration, agent infrastructure]
    technologies: [Python, operator ABI, FieldTick, CSI]
    demonstrates: [AI systems, Automation, Agent infrastructure]
    implementation: "Python"
    featured: true
    status_detail: {stage: active, build: unknown, tests: unknown, documentation: partial, hardware: none}

  - id: canonsphere
    name: "Canonsphere"
    status: active
    category: "visual computing"
    repo: "TheBabelDragon/canonsphere"
    headline: "Computational stereography."
    description: >
      Field state -> canonical bytes -> state hash -> deterministic sigil ->
      stereographic system glyph.
    problem: >
      How do you make system state visible and checkable without a dashboard that lies?
    approach: |
      field state -> canonical bytes -> state hash -> deterministic sigil -> glyph
    architecture: |
      Canonsphere
       +-- canonicalization
       +-- hash
       +-- glyph renderer
    proves: [computer graphics, image processing, deterministic visualization]
    technologies: [JavaScript, computational geometry, hashing]
    demonstrates: [Computer graphics, Image processing, Interactive visualization]
    implementation: "JavaScript"
    featured: true
    status_detail: {stage: active, build: passing, tests: unknown, documentation: partial, hardware: none}

  - id: babel-interface
    name: "babel-interface"
    status: active
    category: "AI infrastructure"
    repo: "TheBabelDragon/babel-interface"
    headline: "Self-describing, AI-addressable contract."
    description: >
      Metadata describes reality; it is not a second implementation.
      An agent loads .babel/ecosystem.yml and walks the capability graph.
    problem: >
      How do you make a constellation of repositories addressable to an agent
      without merging them or rewriting their internals?
    approach: |
      babel discover -> inspect graph -> find interface -> read schema -> invoke
    architecture: |
      .babel/
       +-- manifest.yml
       +-- capabilities.yml
       +-- schemas/
       +-- examples/
       +-- relations.yml
    proves: [information architecture, contract design, agent-addressable systems]
    technologies: [Python, YAML, JSON Schema]
    demonstrates: [Contract design, AI-addressable repos, Capability graphs]
    implementation: "Python / PyYAML / stdlib"
    featured: true
    status_detail: {stage: active, build: passing, tests: passing, documentation: partial, hardware: none}

