lab:
  intro: >
    Not everything here is a finished product. Every card still goes
    somewhere — a dossier, a repository, a tests tree, an examples tree,
    or a running page.
  items:
    - id: optical-body
      name: "Optical Body S3"
      status: prototype
      project: optical-body
      blurb: >
        Laser excitation + BPW34 measurement body. Emits FieldObservation
        packets. Does not run MetaField; it is the physical body.
    - id: echo-grid
      name: "Echo Grid"
      status: prototype
      project: echo-grid
      blurb: >
        Coupled field wavefield computer. FPGA Verilog + ESP32 swarm +
        phased ultrasonic array.
    - id: sprayplot
      name: "Sprayplot"
      status: prototype
      project: sprayplot
      blurb: >
        Laser beacon tracker. Base-station + robot-receiver, boundary map,
        dither-lock.
    - id: wifi-sensing
      name: "WiFi CSI field"
      status: experimental
      project: wifi-sensing
      blurb: >
        Spatial intelligence from channel state. Sensing without cameras
        as the first instrument.
    - id: eeg-loop
      name: "EEG loop"
      status: experimental
      project: eeg-loop
      blurb: >
        Acquisition, analysis, inference, closed-loop control. The skull
        as another field body.
    - id: hall-node
      name: "Hall node S3"
      status: prototype
      project: hall-node
      blurb: >
        10× Hall array → Field Bus (CAN-FD). Stub until the sensors are wired.
    - id: babelbus
      name: "BabelBus"
      status: experimental
      project: babelbus
      blurb: >
        ESP32-P4 HDMI-to-CSI video-only IP display bus. No HID. Safer viewer.
    - id: neuro-swarm
      name: "Neuro swarm"
      status: experimental
      project: neuro-swarm
      blurb: >
        Browser neuroevolution drone murmuration. The running page is the demo.
    - id: signal-processor
      name: "Signal processor"
      status: active
      project: signal-processor
      blurb: >
        Binaural / isochronic / modulation processor. Live preview and WAV export.
    - id: self-state-kernel
      name: "SELF-State Kernel"
      status: experimental
      project: self-state-kernel
      blurb: >
        Fail-closed control, hashable state, provenance via trace.
    - id: laser-grid
      name: "Laser Grid"
      status: concept
      project: sprayplot
      blurb: >
        Wheels + encoders + mapped optical reference grid. The nearest
        living relative is Sprayplot — open that dossier.
    - id: saassaas
      name: "SaaSSaaS"
      status: experimental
      project: saassaas
      blurb: >
        Nested orchestration until the joke compiles. Examples live in-tree.
    - id: nefratz
      name: "Nefratz"
      status: experimental
      project: nefratz
      blurb: >
        Pythonista generative-art organism. Early surface before the field stack.
    - id: metafield-work
      name: "Operator workbench"
      status: experimental
      project: metafield-work
      blurb: >
        Local twin of the frozen Wilson–Dirac ABI. Backends swap; math does not.
